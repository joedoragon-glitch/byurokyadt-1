name: Inspect review build
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["v9-aesthetic-review", "v10-cinema-review", "v10-paper-review", "issue-7-room-completeness"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install acceptance runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect review build without deploying
        run: |
          python3 -m http.server 8000 &
          npm test
      - name: Issue 7 physical room and camera-footprint checks
        if: github.ref_name == 'issue-7-room-completeness'
        run: node tests/room-shell.mjs
      - name: Issue 7 matched 360-degree baseline and candidate photographs
        if: github.ref_name == 'issue-7-room-completeness'
        run: |
          git worktree add --detach "$RUNNER_TEMP/byurokyadt-room-baseline" 9b95387f4e2ee1966cfce7f1bc3ec9a66e4b0e9d
          python3 -m http.server 8001 --directory "$RUNNER_TEMP/byurokyadt-room-baseline" &
          node tests/room-visual.mjs
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: byurokyadt-review
          path: test-results/
          retention-days: 14
