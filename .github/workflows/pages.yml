name: Deploy and inspect БЮРОКЯДТ-1
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install acceptance runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect local build
        run: |
          python3 -m http.server 8000 &
          npm test
      - name: Assemble public files
        run: |
          mkdir _site
          cp index.html styles.css service-worker.js manifest.webmanifest _site/
          cp -R js vendor icons assets _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Inspect deployed application
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm test
      - name: Save visual inspection evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: byurokyadt-acceptance
          path: test-results/
          retention-days: 14
