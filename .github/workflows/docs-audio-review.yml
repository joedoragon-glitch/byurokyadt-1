name: Review documentation and audio room
on:
  pull_request:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "assets/audio-preview.html"
      - "service-worker.js"
      - "package.json"
      - "tests/audio-preview*.mjs"
      - "tests/documentation-links.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify documentation and browser listening room without deployment
        run: |
          python3 -m http.server 8000 > /tmp/byurokyadt-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/assets/audio-preview.html >/dev/null; then break; fi
            sleep 0.5
          done
          npm run test:docs
          npm run test:preview
          npm run test:preview:browser
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audio-room-visual-review
          path: test-results/audio-room-*.png
          if-no-files-found: ignore
          retention-days: 7
